spring.application.name=pedido-item-api
server.port=8080

# foreign_keys=on e aplicado pelo driver SQLite em TODA conexao JDBC aberta.
spring.datasource.url=jdbc:sqlite:pedido-item.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite aceita um escritor por vez: pool de 1 conexao evita "database is locked".
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
